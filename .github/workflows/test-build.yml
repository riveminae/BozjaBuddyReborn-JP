name: Build v1.1 test repository

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bocchi-navigation

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/bocchi-navigation

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply v1.1 source patch
        run: python tools/apply_v110_foundation.py

      - name: Validate patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          git status --short

      - name: Install Dalamud dev files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - name: Restore
        run: dotnet restore BozjaBuddyReborn.csproj

      - name: Build Debug
        run: dotnet build BozjaBuddyReborn.csproj -c Debug --no-restore --nologo

      - name: Build Release
        run: dotnet build BozjaBuddyReborn.csproj -c Release --no-restore --nologo

      - name: Prepare test custom repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-test | Out-Null
          Copy-Item 'bin/Release/BozjaBuddyReborn/latest.zip' 'dist-test/BozjaBuddyReborn.zip' -Force

          $manifest = @'
          [
            {
              "Author": "Bozja Buddy Reborn contributors / JP fork by riveminae",
              "Name": "Bozja Buddy Reborn JP TEST",
              "InternalName": "BozjaBuddyReborn",
              "AssemblyVersion": "1.0.90.1",
              "TestingAssemblyVersion": "1.0.90.1",
              "Description": "v1.1 開発テスト版。BOCCHI方式のフィールド移動、Lifestreamによる南方ボズヤ戦線/ザトゥノル内の簡易テレポ、CE遠隔参加フローを検証します。Stable版repoと同時に有効化しないでください。",
              "Punchline": "Bozja Buddy Reborn JP v1.1 実機テスト版",
              "ApplicableVersion": "any",
              "DalamudApiLevel": 15,
              "Tags": ["bozja", "zadnor", "automation", "japanese", "testing"],
              "CategoryTags": ["utility"],
              "RepoUrl": "https://github.com/riveminae/BozjaBuddyReborn-JP",
              "IconUrl": "",
              "Changelog": "1.0.90.1 - v1.1 foundation: remote CE registration and BOCCHI-style Walk/Aethernet/Walk routing.",
              "IsHide": false,
              "IsTestingExclusive": false,
              "AcceptsFeedback": true,
              "DownloadLinkInstall": "https://raw.githubusercontent.com/riveminae/BozjaBuddyReborn-JP/feat/bocchi-navigation/dist-test/BozjaBuddyReborn.zip",
              "DownloadLinkUpdate": "https://raw.githubusercontent.com/riveminae/BozjaBuddyReborn-JP/feat/bocchi-navigation/dist-test/BozjaBuddyReborn.zip",
              "DownloadLinkTesting": "https://raw.githubusercontent.com/riveminae/BozjaBuddyReborn-JP/feat/bocchi-navigation/dist-test/BozjaBuddyReborn.zip"
            }
          ]
          '@
          Set-Content -Path pluginmaster-test.json -Value $manifest -Encoding utf8

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: BozjaBuddyReborn-JP-v1.1-test
          path: |
            bin/Release/**
            pluginmaster-test.json
          if-no-files-found: error

      - name: Commit validated source and test repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) {
            Write-Host 'No changes to commit.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Configuration.cs Plugin.cs Automation/Movement.cs Automation/TargetSelector.cs Automation/BozjaController.cs Automation/SignUpRunner.cs BozjaBuddyReborn.csproj dist-test/BozjaBuddyReborn.zip pluginmaster-test.json
          git commit -m 'feat: apply validated v1.1 navigation foundation'
          git push origin HEAD:feat/bocchi-navigation
