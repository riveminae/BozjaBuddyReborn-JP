name: Build and publish custom repo

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.cs'
      - 'BozjaBuddyReborn.csproj'
      - 'BozjaBuddyReborn.json'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Dalamud dev files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - name: Restore
        run: dotnet restore BozjaBuddyReborn.csproj

      - name: Build Debug
        run: dotnet build BozjaBuddyReborn.csproj -c Debug --no-restore --nologo

      - name: Build Release
        run: dotnet build BozjaBuddyReborn.csproj -c Release --no-restore --nologo

      - name: Upload release output
        uses: actions/upload-artifact@v4
        with:
          name: BozjaBuddyReborn-JP
          path: bin/Release/**
          if-no-files-found: error

      - name: Prepare Dalamud custom repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'bin/Release/BozjaBuddyReborn/latest.zip' 'dist/BozjaBuddyReborn.zip' -Force

          $manifest = @'
          [
            {
              "Author": "Bozja Buddy Reborn contributors / JP localization by riveminae",
              "Name": "Bozja Buddy Reborn JP",
              "InternalName": "BozjaBuddyReborn",
              "AssemblyVersion": "1.0.28.1",
              "TestingAssemblyVersion": "1.0.28.1",
              "Description": "Bozja Buddy Reborn の日本語クライアント向けfork。南方ボズヤ戦線 / ザトゥノルでCEとスカーミッシュを選択し、vnavmesh・BossMod・Rotation Solver Rebornを連携して移動と戦闘を行います。CEの『参加希望』『戦闘突入』を日本語UIで認識します。移動・戦闘の自動化はFFXIV利用規約上のリスクがあります。自己責任で使用してください。",
              "Punchline": "南方ボズヤ戦線 / ザトゥノルのCE・スカーミッシュ周回を日本語対応",
              "ApplicableVersion": "any",
              "DalamudApiLevel": 15,
              "Tags": ["bozja", "zadnor", "field operations", "automation", "japanese"],
              "CategoryTags": ["utility"],
              "RepoUrl": "https://github.com/riveminae/BozjaBuddyReborn-JP",
              "IconUrl": "",
              "Changelog": "1.0.28.1 - Japanese client support for Critical Engagement registration/commence and Japanese localization for primary UI controls.",
              "IsHide": false,
              "IsTestingExclusive": false,
              "AcceptsFeedback": true,
              "DownloadLinkInstall": "https://raw.githubusercontent.com/riveminae/BozjaBuddyReborn-JP/main/dist/BozjaBuddyReborn.zip",
              "DownloadLinkUpdate": "https://raw.githubusercontent.com/riveminae/BozjaBuddyReborn-JP/main/dist/BozjaBuddyReborn.zip",
              "DownloadLinkTesting": "https://raw.githubusercontent.com/riveminae/BozjaBuddyReborn-JP/main/dist/BozjaBuddyReborn.zip"
            }
          ]
          '@
          Set-Content -Path pluginmaster.json -Value $manifest -Encoding utf8

      - name: Publish custom repo files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) {
            Write-Host 'No distribution changes.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/BozjaBuddyReborn.zip pluginmaster.json
          git commit -m 'build: publish Dalamud custom repository package'
          git push
