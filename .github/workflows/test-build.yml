name: Build v1.1 test repository

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bocchi-navigation

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/bocchi-navigation

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply v1.1 source patches
        run: |
          python tools/apply_v110_foundation.py
          python tools/apply_v110_survival.py

      - name: Apply AGPL-3.0 distribution license
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/OhKannaDuh/BOCCHI/7847b00c313d6a7ddfe9ee126e46e10f547db9da/LICENSE' -OutFile LICENSE

      - name: Validate patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          git status --short

      - name: Install Dalamud dev files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - name: Restore
        run: dotnet restore BozjaBuddyReborn.csproj

      - name: Build Debug
        run: dotnet build BozjaBuddyReborn.csproj -c Debug --no-restore --nologo

      - name: Build Release
        run: dotnet build BozjaBuddyReborn.csproj -c Release --no-restore --nologo

      - name: Prepare test custom repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-test | Out-Null
          Copy-Item 'bin/Release/BozjaBuddyReborn/latest.zip' 'dist-test/BozjaBuddyReborn.zip' -Force

          $manifest = @'
          [
            {
              "Author": "Bozja Buddy Reborn contributors / JP fork by riveminae",
              "Name": "Bozja Buddy Reborn JP TEST",
              "InternalName": "BozjaBuddyReborn",
              "AssemblyVersion": "1.0.90.2",
              "TestingAssemblyVersion": "1.0.90.2",
              "Description": "v1.1 開発テスト版。BOCCHI方式のフィールド移動、Lifestream簡易テレポ、CE遠隔参加、IV/V/★敵回避、生存優先Lost Actionを検証します。Stable版repoと同時に有効化しないでください。",
              "Punchline": "Bozja Buddy Reborn JP v1.1 実機テスト版",
              "ApplicableVersion": "any",
              "DalamudApiLevel": 15,
              "Tags": ["bozja", "zadnor", "automation", "japanese", "testing"],
              "CategoryTags": ["utility"],
              "RepoUrl": "https://github.com/riveminae/BozjaBuddyReborn-JP",
              "IconUrl": "",
              "Changelog": "1.0.90.2 - survival/rank test: IV/V/★ avoidance, mounted-action guard, role HP thresholds, Potion Kit/Reraiser/heal/Manawall survival policy, Japanese UI foundation.",
              "IsHide": false,
              "IsTestingExclusive": false,
              "AcceptsFeedback": true,
              "DownloadLinkInstall": "https://raw.githubusercontent.com/riveminae/BozjaBuddyReborn-JP/feat/bocchi-navigation/dist-test/BozjaBuddyReborn.zip",
              "DownloadLinkUpdate": "https://raw.githubusercontent.com/riveminae/BozjaBuddyReborn-JP/feat/bocchi-navigation/dist-test/BozjaBuddyReborn.zip",
              "DownloadLinkTesting": "https://raw.githubusercontent.com/riveminae/BozjaBuddyReborn-JP/feat/bocchi-navigation/dist-test/BozjaBuddyReborn.zip"
            }
          ]
          '@
          Set-Content -Path pluginmaster-test.json -Value $manifest -Encoding utf8

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: BozjaBuddyReborn-JP-v1.1-test
          path: |
            bin/Release/**
            pluginmaster-test.json
          if-no-files-found: error

      - name: Commit validated source and test repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) {
            Write-Host 'No changes to commit.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Configuration.cs Localization.cs Plugin.cs LICENSE THIRD-PARTY-NOTICES.md BozjaBuddyReborn.csproj
          git add Automation/Movement.cs Automation/TargetSelector.cs Automation/BozjaController.cs Automation/SignUpRunner.cs Automation/AggroAvoidance.cs Automation/HolsterDriver.cs
          git add Game/SurvivalPolicy.cs Game/EnemyStrengthResolver.cs External/LifestreamIpc.cs Game/FieldAethernet.cs Vendor/BOCCHI/NavigationConstants.cs Automation/FieldTravelRouter.cs
          git add Windows/MainWindow.cs Windows/ConfigWindow.cs
          git add dist-test/BozjaBuddyReborn.zip pluginmaster-test.json
          git commit -m 'feat: apply validated v1.1 survival and rank automation'
          git push origin HEAD:feat/bocchi-navigation
